name: Fix capacity-loss type

on:
  push:
    branches:
      - feature/contractor-capacity-loss-demo

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/contractor-capacity-loss-demo
      - name: Fix circuit map key type
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/use-cases/contractor-allocation/capacity-loss-workspace.tsx')
          s = p.read_text()
          old = "const circuitById = useMemo(() => new Map(EVERSOURCE_CAPACITY_LOSS_CIRCUITS.map((row) => [row.circuit, row])), [])"
          new = "const circuitById = useMemo(\n    () =>\n      new Map<string, (typeof EVERSOURCE_CAPACITY_LOSS_CIRCUITS)[number]>(\n        EVERSOURCE_CAPACITY_LOSS_CIRCUITS.map((row) => [row.circuit, row])\n      ),\n    []\n  )"
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old, new))
          PY
          npx prettier --write src/use-cases/contractor-allocation/capacity-loss-workspace.tsx
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/use-cases/contractor-allocation/capacity-loss-workspace.tsx
          git commit -m "fix(contractor-allocation): widen circuit lookup key" || exit 0
          git push origin HEAD:feature/contractor-capacity-loss-demo
