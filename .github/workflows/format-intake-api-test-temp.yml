name: Temporary Intake API Test Formatter

on:
  push:
    branches:
      - feat/decision-intake-problem-formalization

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write src/features/decision-intake/services/intake-api.test.ts
          rm .github/workflows/format-intake-api-test-temp.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/decision-intake/services/intake-api.test.ts
          git add .github/workflows/format-intake-api-test-temp.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format decision intake execution test"
            git push origin HEAD:feat/decision-intake-problem-formalization
          fi
