name: RR UX Branch Validation

on:
  push:
    branches:
      - feat/rr-ux-acceptance-remainder

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Prettier
        run: |
          pnpm exec prettier --write e2e/rr-ux-evidence-comparison.spec.ts src/use-cases/readiness-recovery/operator-comparison.tsx src/use-cases/readiness-recovery/operator-comparison.vitest.test.tsx src/use-cases/readiness-recovery/operator-evidence.tsx src/use-cases/readiness-recovery/operator-evidence.vitest.test.tsx src/use-cases/readiness-recovery/production-operator-panel.tsx
          git --no-pager diff -- e2e/rr-ux-evidence-comparison.spec.ts src/use-cases/readiness-recovery/operator-comparison.tsx src/use-cases/readiness-recovery/operator-comparison.vitest.test.tsx src/use-cases/readiness-recovery/operator-evidence.tsx src/use-cases/readiness-recovery/operator-evidence.vitest.test.tsx src/use-cases/readiness-recovery/production-operator-panel.tsx

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
