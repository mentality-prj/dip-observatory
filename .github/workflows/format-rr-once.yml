name: One-time RR code formatting

on:
  push:
    branches: [fix/rr-single-kernel-authority]
    paths:
      - '.github/workflows/format-rr-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact project dependencies
        run: pnpm install --frozen-lockfile
      - name: Format RR code
        run: |
          pnpm exec prettier --write \
            e2e/rr-production-operator.spec.ts \
            'src/app/api/rr-operator/kernel/[...path]/route.ts' \
            'src/app/readiness/scenarios/[[...path]]/route.ts' \
            src/lib/rr-kernel-route-allowlist.ts \
            src/lib/rr-operator-auth.ts \
            src/lib/rr-operator-auth.vitest.test.ts \
            src/use-cases/application-runtime.tsx \
            src/use-cases/readiness-recovery/kernel-workspace.tsx \
            src/use-cases/readiness-recovery/production-operator-panel.tsx \
            src/use-cases/routing-contract.test.ts
      - name: Commit formatted files on same PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/rr-production-operator.spec.ts src
          if ! git diff --cached --quiet; then
            git commit -m 'style(rr): apply project Prettier to Kernel-only route'
            git push origin HEAD:fix/rr-single-kernel-authority
          fi
