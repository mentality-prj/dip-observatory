name: Temporary OIDC formatting
on:
  push:
    branches:
      - feat/qdip-zitadel-oidc
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write src/lib/qdip-oidc.ts
          git add src/lib/qdip-oidc.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "style(auth): apply Prettier to OIDC grant isolation"
            git push origin HEAD:feat/qdip-zitadel-oidc
          fi
