name: Fix audit E2E selectors

on:
  push:
    branches:
      - audit/application-wide-functional-correctness

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[e2e-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/application-wide-functional-correctness
      - run: |
          python - <<'PY'
          from pathlib import Path

          gtm = Path('e2e/gtm-lab-public.spec.ts')
          text = gtm.read_text()
          text = text.replace("page.locator('input[type=\"file\"]').setInputFiles", "page.locator('input[type=\"file\"][accept=\".csv,text/csv\"]').setInputFiles")
          gtm.write_text(text)

          resource = Path('e2e/resource-allocation-client-demo.spec.ts')
          text = resource.read_text()
          text = text.replace("const input = page.locator('input[type=\"file\"]')", "const input = page.locator('[data-testid=\"resource-import-file\"]')")
          text = text.replace("await page.locator('input[type=\"file\"]').setInputFiles({", "await page.locator('[data-testid=\"resource-import-file\"]').setInputFiles({")
          resource.write_text(text)
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/
          git commit -m "test(e2e): target domain import controls [e2e-fixed]"
          git push origin HEAD:audit/application-wide-functional-correctness
