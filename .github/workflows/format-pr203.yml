name: Format PR 203

on:
  push:
    branches:
      - feat/readiness-cascading-resource-conflict

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/readiness-cascading-resource-conflict
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed readiness files
        run: >-
          pnpm exec prettier --write
          'src/app/readiness/scenarios/[[...path]]/route.ts'
          src/use-cases/readiness-recovery/advantage.tsx
          src/use-cases/readiness-recovery/benchmark-suite.ts
          src/use-cases/readiness-recovery/benchmark-suite.vitest.test.ts
          src/use-cases/readiness-recovery/cascading-resource-conflict.ts
          src/use-cases/readiness-recovery/cascading-resource-conflict.vitest.test.ts
          src/use-cases/readiness-recovery/demo-data.ts
          src/use-cases/readiness-recovery/domain.ts
          src/use-cases/readiness-recovery/i18n.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/readiness/scenarios/ src/use-cases/readiness-recovery/
          git commit -m 'style(readiness): apply prettier'
          git push origin HEAD:feat/readiness-cascading-resource-conflict
