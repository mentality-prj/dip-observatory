name: Fix resource E2E selector
on:
  push:
    branches: [audit/application-wide-functional-correctness]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[resource-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/application-wide-functional-correctness
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/resource-allocation-client-demo.spec.ts')
          text = path.read_text().replace("page.locator('[data-testid=\"resource-import-file\"]')", "page.locator('input[type=\"file\"][accept*=\"text/csv\"]')")
          path.write_text(text)
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/resource-allocation-client-demo.spec.ts
          git commit -m "test(e2e): select resource allocation domain file input [resource-fixed]"
          git push origin HEAD:audit/application-wide-functional-correctness
