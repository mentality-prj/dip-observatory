name: RR OIDC format (temporary)
on:
  push:
    branches:
      - feat/qdip-zitadel-oidc
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed TypeScript
        run: |
          git diff --name-only --diff-filter=ACM origin/dev...HEAD | grep -E '\.(ts|tsx|md|yml)$' > /tmp/rr-oidc-changed || true
          if [ -s /tmp/rr-oidc-changed ]; then
            xargs -d '\n' pnpm exec prettier --write < /tmp/rr-oidc-changed
            git add --pathspec-from-file=/tmp/rr-oidc-changed
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'style(rr): format OIDC actor proof'
              git push
            fi
          fi
