name: Debug Prettier
on:
  push:
    branches:
      - fix/ds-navigation-select-spacing
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier src/studio/binding-editor.tsx --write
      - run: git diff -- src/studio/binding-editor.tsx
