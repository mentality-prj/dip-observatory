name: Decision Challenge production smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Observatory deployment URL
        required: true
        type: string
  schedule:
    - cron: '17 6 * * *'

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.OBSERVATORY_PRODUCTION_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ inputs.base_url || vars.OBSERVATORY_PRODUCTION_URL }}
    steps:
      - name: Verify public Challenge page
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/en/challenges" >/dev/null
      - name: Verify Challenge definitions proxy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/api/decision-challenge" | grep -q 'resource-allocation-v1'
