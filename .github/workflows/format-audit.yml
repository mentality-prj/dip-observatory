name: Format audit branch

on:
  push:
    branches:
      - audit/application-wide-functional-correctness

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/application-wide-functional-correctness
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write e2e/observatory-routing-contract.spec.ts src/components/observatory/analyst-data-panel.tsx src/components/observatory/data-intake-contract.ts src/components/observatory/analyst-data-registry.ts src/features/gtm-lab/components/gtm-production-import.tsx src/features/gtm-lab/data-workspace.ts src/features/gtm-lab/data-workspace.test.ts src/features/resource-allocation/components/resource-allocation-import.tsx src/features/resource-allocation/data-workspace.ts src/features/resource-allocation/data-workspace.vitest.test.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply prettier [formatted]"
          git push origin HEAD:audit/application-wide-functional-correctness
