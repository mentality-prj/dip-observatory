name: RR migration branch validation
on:
  push:
    branches:
      - fix/rr-ux-reverse-audit-integrity
permissions:
  contents: write
jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and commit only changed files
        run: |
          git diff --name-only --diff-filter=ACM origin/dev...HEAD | grep -E '\.(ts|tsx|md|yml)$' > /tmp/rr-changed || true
          if [ -s /tmp/rr-changed ]; then
            xargs -d '\n' pnpm exec prettier --write < /tmp/rr-changed
            git add --pathspec-from-file=/tmp/rr-changed
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'style(rr): format reverse-audit remedies'
              git push
            fi
          fi
      - name: Lint
        run: pnpm lint
      - name: Prettier
        run: pnpm prettier
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
