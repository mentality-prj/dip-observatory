name: Format Studio BFF Once
on:
  push:
    branches: [feat/qdip-zitadel-oidc]
    paths:
      - 'src/app/api/studio/**'
      - '.github/workflows/format-studio-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write 'src/app/api/studio/[...path]/route.ts' 'src/app/api/studio/[...path]/route.vitest.test.ts'
      - name: Commit formatting only when changed
        run: |
          git add 'src/app/api/studio/[...path]/route.ts' 'src/app/api/studio/[...path]/route.vitest.test.ts'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(studio): format security boundary and tests'
            git push
          fi
