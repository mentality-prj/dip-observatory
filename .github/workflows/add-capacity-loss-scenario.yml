name: Add capacity loss demo scenario

on:
  push:
    branches:
      - feature/contractor-capacity-loss-demo

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/contractor-capacity-loss-demo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply scenario patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          pnpm exec prettier --write src/use-cases/contractor-allocation

      - name: Lint
        run: pnpm lint

      - name: Prettier
        run: pnpm prettier

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Commit verified scenario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-capacity-loss-scenario.yml
          git add src/use-cases/contractor-allocation
          git commit -m "feat: add contractor capacity loss recovery scenario"
          git push origin HEAD:feature/contractor-capacity-loss-demo
