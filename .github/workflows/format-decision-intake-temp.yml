name: Temporary Decision Intake Formatter

on:
  push:
    branches:
      - feat/decision-intake-problem-formalization

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Decision Intake files
        run: |
          pnpm exec prettier --write             src/features/decision-intake/model/contracts.test.ts             src/features/decision-intake/model/contracts.ts             src/features/decision-intake/workspace.tsx
          rm .github/workflows/format-decision-intake-temp.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/decision-intake/model/contracts.test.ts
          git add src/features/decision-intake/model/contracts.ts
          git add src/features/decision-intake/workspace.tsx
          git add .github/workflows/format-decision-intake-temp.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format decision intake formalization"
            git push origin HEAD:feat/decision-intake-problem-formalization
          fi
