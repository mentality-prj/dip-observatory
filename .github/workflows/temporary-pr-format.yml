name: Temporary PR formatting
on:
  push:
    branches:
      - feat/qdip-zitadel-oidc
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files and commit
        shell: bash
        run: |
          pnpm exec prettier --write 'src/lib/qdip-oidc*.ts' 'src/lib/rr-operator-auth*.ts' 'src/app/api/auth/**/*.ts' 'src/app/api/rr-operator/session/route.ts' 'src/app/api/studio/**/*.ts' 'src/app/studio/layout.tsx' 'src/use-cases/readiness-recovery/*.tsx' '.env.example' 'README.md'
          git add -u
          git add src/lib/qdip-oidc.ts src/lib/qdip-oidc.vitest.test.ts src/app/api/auth/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "style(auth): format Zitadel OIDC integration"
            git push origin HEAD:feat/qdip-zitadel-oidc
          fi
