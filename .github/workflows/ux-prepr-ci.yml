name: UX pre-PR validation

on:
  push:
    branches:
      - feat/ux-03-personal-observatory

permissions:
  contents: write

jobs:
  ux-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize formatting of UX branch edits
        run: |
          git diff --name-only origin/dev...HEAD | grep -E '\.(ts|tsx|md|yml)$' > /tmp/ux-changed || true
          if [ -s /tmp/ux-changed ]; then
            xargs -d '\n' pnpm exec prettier --write < /tmp/ux-changed
            git add --pathspec-from-file=/tmp/ux-changed
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "style(ux): format decision-first Observatory changes"
              git push
            fi
          fi
      - name: Lint
        run: pnpm lint
      - name: Prettier
        run: pnpm prettier
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser E2E
        run: pnpm test:e2e
