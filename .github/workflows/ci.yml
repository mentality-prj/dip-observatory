name: CI

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: fix/readiness-evidence-validation

      - name: Apply label fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/use-cases/readiness-recovery/planner.ts')
          text = path.read_text()
          old = "const candidate = [...frontier].sort(compare).find((scenario) => !selected.has(scenario.scenarioId))\n    if (candidate) selected.set(candidate.scenarioId, label)"
          new = "const candidate = [...frontier].sort(compare)[0]\n    if (candidate && !selected.has(candidate.scenarioId)) selected.set(candidate.scenarioId, label)"
          if old not in text:
              raise SystemExit('target snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/use-cases/readiness-recovery/planner.ts
          git commit -m "fix(readiness): keep scenario labels objective-truthful"
          git push origin HEAD:fix/readiness-evidence-validation
