name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format plugin catalog feature once
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/observatory-plugin-catalog-registration-261'
        run: |
          pnpm exec prettier --write 'src/app/[locale]/plugins/[name]/page.tsx' 'src/app/api/observatory/admin/plugins/[name]/route.ts' src/components/observatory/observatory-plugin-admin.tsx src/components/observatory/prototype-shell.tsx e2e/observatory-plugin-registration.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src e2e
          if ! git diff --cached --quiet; then
            git commit -m 'style: format plugin registration and directory'
            git push origin HEAD:feat/observatory-plugin-catalog-registration-261
          fi

      - name: Lint
        run: pnpm lint

      - name: Prettier
        run: pnpm prettier

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
