name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: pnpm exec prettier --write src/use-cases/contractor-allocation/capacity-loss-scenario.ts src/use-cases/contractor-allocation/capacity-loss-workspace.tsx

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/use-cases/contractor-allocation/capacity-loss-scenario.ts src/use-cases/contractor-allocation/capacity-loss-workspace.tsx
          git commit -m "style: format capacity loss economic value demo"
          git push origin HEAD:${{ github.head_ref }}

      - name: Prettier
        run: pnpm prettier
