name: CI
on:
  pull_request:
    branches: [dev]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exact Prettier diff
        run: |
          pnpm exec prettier --write src/components/observatory/observatory-home.tsx src/components/observatory/prototype-shell.tsx src/features/decision-intake/workspace.tsx src/observatory/application-copy.ts
          git diff -- src/components/observatory/observatory-home.tsx src/components/observatory/prototype-shell.tsx src/features/decision-intake/workspace.tsx src/observatory/application-copy.ts
