name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair execution-window fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/use-cases/contractor-allocation/optimizer.vitest.test.ts')
          text = path.read_text()
          old = """    scenario.units = [unit('NOV', 'X', 1, '2026-11')]\n    scenario.contractors[0].contracts[0].validTo = '2026-10-15'\n"""
          new = """    scenario.units = [unit('NOV', 'X', 1, '2026-11')]\n    scenario.contractors = scenario.contractors.map((contractor) => ({\n      ...contractor,\n      capacityBuckets: [...contractor.capacityBuckets, { bucket: '2026-11', availableCapacity: 3 }],\n    }))\n    scenario.contractors[0].contracts[0].validTo = '2026-10-15'\n"""
          if old not in text:
              raise SystemExit('target fixture not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format fixture
        run: pnpm exec prettier --write src/use-cases/contractor-allocation/optimizer.vitest.test.ts

      - name: Commit fixture repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/use-cases/contractor-allocation/optimizer.vitest.test.ts
          git commit -m "test: isolate contract execution-window validation"
          git push origin HEAD:${{ github.head_ref }}
