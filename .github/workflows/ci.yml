name: Format Decision Intake PR
on:
  pull_request:
    branches: [dev]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/observatory-decision-intake-app
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and commit
        run: |
          pnpm exec prettier --write src/components/observatory/observatory-home.tsx src/components/observatory/prototype-shell.tsx src/features/decision-intake/workspace.tsx src/observatory/application-copy.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/observatory/observatory-home.tsx src/components/observatory/prototype-shell.tsx src/features/decision-intake/workspace.tsx src/observatory/application-copy.ts
          git commit -m "fix: format Observatory application UI"
          git push origin HEAD:feat/observatory-decision-intake-app
